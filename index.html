<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>📝 Todo App</h1>

    <form id="todo-form" class="todo-form">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="할 일을 입력하세요"
        autocomplete="off"
      />
      <button type="submit" class="btn-add">추가</button>
    </form>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">전체</button>
      <button class="filter-btn" data-filter="active">미완료</button>
      <button class="filter-btn" data-filter="completed">완료</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <div class="todo-footer">
      <span id="items-left">0개 남음</span>
      <button id="clear-completed" class="btn-clear">완료 항목 삭제</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
